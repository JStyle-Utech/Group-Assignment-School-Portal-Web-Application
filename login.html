<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Login | [SCHOOL NAME]</title>
    <link rel="stylesheet" href="css/masterstylesheet.css" />
  </head>

  <body>
    <!--Navigation-->
    <header>
      <div class="container">
        <a href="index.html" class="logo"> School Portal </a>

        <nav aria-label="Main">
          <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT US</a></li>
            <li><a href="contact.html">CONTACT US</a></li>
            <li><a href="login.html">PORTAL LOGIN</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!--Intro for Login-->
      <section class="welcome-section">
        <div class="container">
          <h1>Welcome Back!</h1>
          <p>Sign in to access your school portal</p>
        </div>
      </section>

      <!--Login Form-->
      <section class="login-section">
        <div class="container">
          <h2>Portal Login</h2>

          <form id="login-form">
            <div class="field">
              <label for="username">Username or Email</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username or email"
                required
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="actions">
              <button type="submit" class="button">Log In</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 [SCHOOL NAME]. All rights reserved</p>
      </div>
    </footer>
  </body>
</html>
